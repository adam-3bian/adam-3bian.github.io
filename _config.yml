markdown: kramdown
future: true
kramdown:
  input: Kramdown
  auto_ids: false
  smart_quotes:
  - apos
  - apos
  - quot
  - quot
  typographic_symbols:
    hellip: '...'
    mdash: '---'
    ndash: --
    laquo: '<<'
    raquo: '>>'
exclude:
- sources
- reports
- sitemap.json
- sitemap.md
- scripts
- requirements-migration.txt
- CHERI_SITE_INVENTORY.json
- CHERI_HIERARCHICAL_SITEMAP.md
- PROGRESS.md
- MIGRATION_SPEC.md
- README_MIGRATION.md
- tests
- README.md
- _data
- docs
- Gemfile
- Gemfile.lock
- _plugins
- vendor
- assets/shared/source-assets/dcabdf6735d3-searcher.js
- assets/shared/source-assets/9da9f832380b-searcher.js
- assets/shared/source-assets/0845a75c73d4-elasticlunr.min.js
- requirements-dev.txt
- dist
- dist-baseurl
- _site
