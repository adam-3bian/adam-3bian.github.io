markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks:
  - paragraph_end
  - no_auto_typographic
  auto_ids: true
  smart_quotes:
  - apos
  - apos
  - quot
  - quot
exclude:
- README.md
- NAVIGATION.md
- FRONT_MATTER.MD
- Gemfile
- Gemfile.lock
- scripts
- reports
- dist
- dist-baseurl
- vendor
- .bundle
collections:
  people:
    output: true
    permalink: /people/:name/
  news:
    output: true
    permalink: /news/:name/
  organisations:
    output: true
    permalink: /organisations/:name/
  events:
