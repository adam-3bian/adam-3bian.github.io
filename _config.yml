title: Small Heath Park Housing Co-operative Ltd
short_title: Small Heath Park Housing Co-operative
description: A resident-led social housing co-operative in Small Heath, Birmingham.
lang: en-GB
url: https://adam-3bian.github.io
baseurl: ''
markdown: kramdown
kramdown:
  input: Kramdown
permalink: pretty
defaults:
  - scope:
      path: ''
    values:
      layout: page
      presentation:
        width: reading
forms:
  # Public HTTPS URL of backend/public/index.php on your separate PHP host.
  # Recipient addresses and SMTP credentials belong in the backend's ignored .env.
  endpoint: ''
  privacy_url: /form-information/
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - tests
  - vendor
  - node_modules
  - work
  - backend
