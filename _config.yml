title: Small Heath Park Housing Co-operative Ltd
short_title: Small Heath Park Housing Co-operative
description: A resident-led social housing co-operative in Small Heath, Birmingham.
lang: en-GB
url: https://adam-3bian.github.io
baseurl: ''
markdown: kramdown
kramdown:
  input: Kramdown
permalink: pretty
defaults:
  - scope:
      path: ''
    values:
      layout: page
forms:
  # Leave empty on Pages until a separate HTTPS handler is available.
  # The PHP build profile sets this to /forms/index.php on the same host.
  endpoint: ''
  privacy_url: /form-information/
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs
  - tests
  - vendor
  - node_modules
  - work
  - compose.yml
  - docker
  - etc
  - www
  - var
  - forms
  - form-runtime
