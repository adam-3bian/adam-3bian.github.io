# Explanatory presentation, grounded in the linked existing technical pages.
steps:
- id: bounds
  label: Explore bounds
  title: Authority has a boundary.
  description: A capability carries an address, bounds and permissions, protected by a hardware validity tag. The highlighted region represents the memory this example capability authorises.
  result: 'C0 · valid · load + store'
  url: /build/technology/capabilities/
- id: permitted
  label: Read within bounds
  title: The access is permitted.
  description: The complete read lies within the capability’s bounds and has load permission. The processor also checks validity and whether the capability is usable for this operation.
  result: 'LOAD · within bounds · permitted'
  url: /build/technology/bounds/
- id: rejected
  label: Try outside bounds
  title: The access is rejected.
  description: Knowing an address does not grant authority to use it. An access outside this capability’s bounds faults, even when adjacent memory exists.
  result: 'LOAD · outside bounds · fault'
  url: /build/technology/spatial-memory-safety/
- id: readonly
  label: Remove write permission
  title: Less authority. Enforced in hardware.
  description: Deriving a read-only capability removes store permission. A write through that derived capability faults, even inside its bounds. Removed authority cannot be restored from the derived capability alone.
  result: 'DERIVED C1 · load only · store faults'
  url: /build/technology/permissions/
- id: compartments
  label: Explore compartments
  title: Share an interface. Isolate the rest.
  description: Compartments receive selected capabilities rather than unrestricted access to one another’s memory. Controlled entry needs a suitable runtime and calling convention; sealing can protect entry points and opaque tokens.
  result: 'COMPARTMENT B · separate authority'
  url: /build/technology/compartmentalisation/
