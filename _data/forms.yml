contact:
  id: cheri-contact
  title: Your enquiry
  description: Tell us how we can help with your enquiry.
  submission:
    # Same-origin endpoint, proxied by nginx; it redirects to /alliance/membership/thanks/.
    mode: post
    url: /f/contact
    label: Send enquiry
    verified: true
    success_message: Thank you for contacting the CHERI Alliance. We will reply to the email address you provided.
    error_message: Your enquiry could not be sent. Please try again later.
    security:
      honeypot: _gotcha
      timestamp: _ts
      captcha: /captcha/challenge
  fields:
  - name: topic
    label: Request
    type: select
    required: true
    placeholder: Choose a request
    options:
    - label: I would like to know more about CHERI Alliance.
      value: I would like to know more about CHERI Alliance.
    - label: I am interested in becoming a member.
      value: I am interested in becoming a member.
    - label: I would like to know more about or contact a working group.
      value: I would like to know more about or contact a working group.
    - label: I have a press related matter.
      value: I have a press related matter.
    - label: I would like to know more about the Ambassador Program.
      value: I would like to know more about the Ambassador Program.
    - label: I would like to know more about or apply to the CHERI Enabled Program.
      value: I would like to know more about or apply to the CHERI Enabled Program.
    - label: I have a question about Trademark permissions.
      value: I have a question about Trademark permissions.
    - label: I am interested in a Morello board.
      value: I am interested in a Morello board.
    - label: I have another request.
      value: I have another request.
    width: full
  - name: first-name
    label: First name
    autocomplete: given-name
    type: text
    required: true
    pattern: .*\S.*
    width: half
  - name: last-name
    label: Last name
    autocomplete: family-name
    type: text
    required: true
    pattern: .*\S.*
    width: half
  - name: email
    label: Email
    type: email
    required: true
    autocomplete: email
    width: full
  - name: message
    label: Your request
    type: textarea
    required: true
    rows: 6
    width: full
  privacy_url: /policies/privacy/
