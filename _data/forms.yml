# Source-backed presentation of the published contact and newsletter options.
# Form submission is intentionally unavailable on the static preview.
contact:
  id: cheri-contact
  title: Your enquiry
  submit: Send enquiry
  demo: 'Preview form — messages are not sent.'
  external_url: 'https://cheri-alliance.org/contact/#contact_form'
  external_label: Use the published Alliance contact form
  privacy_url: /policies/privacy/
  fields:
    - name: topic
      label: Request
      type: select
      size: full
      options:
        - label: I would like to know more about CHERI Alliance.
        - label: I am interested in becoming a member.
        - label: I would like to know more about or contact a working group.
        - label: I have a press related matter.
        - label: I would like to know more about the Ambassador Program.
        - label: I would like to know more about or apply to the CHERI Enabled Program.
        - label: I have a question about Trademark permissions.
        - label: I am interested in a Morello board.
        - label: I have another request.
    - name: first-name
      label: First name
      size: half
      autocomplete: given-name
    - name: last-name
      label: Last name
      size: half
      autocomplete: family-name
    - name: email
      label: Email
      type: email
      autocomplete: email
    - name: message
      label: Your request
      type: textarea
      rows: 6
newsletter:
  id: cheri-newsletter
  title: Get the quarterly newsletter
  submit: Subscribe
  demo: 'Preview form — entering an email does not subscribe you.'
  external_url: https://cheri-alliance.kit.com/subscribe
  external_label: Subscribe through the published Alliance mailing list
  fields:
    - name: email
      label: Email address
      type: email
      autocomplete: email
      size: full
