name: Validate and deploy Jekyll

on:
  push:
    branches: [main, design/catalogue-polish]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/accessibility" --no-audit --no-fund axe-core@4.10.3
      - name: Validate structured records and event boundaries
        run: |
          python scripts/check_content.py
          python scripts/check_refinement.py
          bundle exec ruby scripts/test_event_status.rb
          bundle exec ruby scripts/test_forms.rb
      - name: Build and validate root and preview deployments
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --safe --destination dist
          python scripts/check_content.py --site dist --report reports/root-content.json
          python scripts/check_refinement.py --site dist
          JEKYLL_ENV=production bundle exec jekyll build --safe --baseurl /preview --destination dist-baseurl/preview
          python scripts/check_content.py --site dist-baseurl/preview --baseurl /preview --report reports/preview-content.json
          python scripts/check_refinement.py --site dist-baseurl/preview --baseurl /preview
      - name: Check interactions, accessibility and responsive layouts
        run: |
          python -m http.server 4200 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/site.log" 2>&1 &
          root_server_pid=$!
          python -m http.server 4201 --bind 127.0.0.1 --directory dist-baseurl > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_server_pid=$!
          trap 'kill "$root_server_pid" "$preview_server_pid"' EXIT
          export AXE_PATH="$RUNNER_TEMP/accessibility/node_modules/axe-core/axe.min.js"
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/browser python scripts/test_catalog.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/preview-browser python scripts/test_catalog.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/layout-fixes/after python scripts/test_layouts.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/layout-fixes/preview python scripts/test_layouts.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/polish/after python scripts/test_presentation.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/polish/preview python scripts/test_presentation.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/refinement/after python scripts/test_refinement.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/refinement/preview python scripts/test_refinement.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/consistency/root python scripts/test_consistency.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/consistency/preview python scripts/test_consistency.py
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-review
          path: reports/
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
