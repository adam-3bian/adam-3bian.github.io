name: Build and deploy Jekyll

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build with GitHub Pages restrictions
        run: JEKYLL_ENV=production bundle exec jekyll build --safe --strict_front_matter
      - name: Check generated pages and links
        run: python3 tests/check-site.py _site
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/navigation.js
          node --check assets/js/forms.js
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, mbstring
          tools: composer:v2
      - name: Build and test the portable PHP version
        run: |
          composer install --working-dir=forms --no-dev --prefer-dist --no-interaction --optimize-autoloader
          bundle exec jekyll build --safe --strict_front_matter --config _config.yml,_config-php.yml --destination work/php-site
          python3 tests/check-site.py work/php-site --php
          PHP_SITE=work/php-site python3 tests/check-backend.py
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
