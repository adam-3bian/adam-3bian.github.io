name: Validate and deploy Jekyll

on:
  push:
    branches: [main, design/catalogue-polish]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with GitHub Pages Jekyll
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - name: Build the native Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./dist
          future: true
      - name: Share Jekyll output with validation
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: dist
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  validate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation tools
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium firefox webkit
          npm install --prefix "$RUNNER_TEMP/accessibility" --no-audit --no-fund axe-core@4.10.3
      - uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          path: dist
      - name: Validate structured records and event boundaries
        run: |
          python scripts/check_content.py
          python scripts/check_refinement.py
          python scripts/test_spec.py
          python scripts/template_inventory.py --output reports/templates.json
          bundle exec ruby scripts/test_event_status.rb
          bundle exec ruby scripts/test_forms.rb
          bundle exec ruby scripts/test_relationships.rb
      - name: Validate official build and Jekyll preview deployment
        run: |
          python scripts/check_content.py --site dist --report reports/root-content.json
          python scripts/check_refinement.py --site dist
          bundle exec ruby scripts/test_markdown.rb dist
          python scripts/check_component_parity.py docs/design-polish/rendered-baseline.json dist --report reports/component-parity-root.json
          JEKYLL_ENV=production bundle exec jekyll build --safe --baseurl /preview --destination dist-baseurl/preview
          python scripts/check_content.py --site dist-baseurl/preview --baseurl /preview --report reports/preview-content.json
          python scripts/check_refinement.py --site dist-baseurl/preview --baseurl /preview
          bundle exec ruby scripts/test_markdown.rb dist-baseurl/preview
          python scripts/check_component_parity.py docs/design-polish/rendered-baseline.json dist-baseurl/preview --baseurl /preview --report reports/component-parity-preview.json
      - name: Check interactions, accessibility and responsive layouts
        run: |
          python -m http.server 4200 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/site.log" 2>&1 &
          root_server_pid=$!
          python -m http.server 4201 --bind 127.0.0.1 --directory dist-baseurl > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview_server_pid=$!
          trap 'kill "$root_server_pid" "$preview_server_pid"' EXIT
          export AXE_PATH="$RUNNER_TEMP/accessibility/node_modules/axe-core/axe.min.js"
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/components/root python scripts/test_components.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/components/preview python scripts/test_components.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/forms/root python scripts/test_forms.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/forms/preview python scripts/test_forms.py
          BROWSERS=webkit,chromium,firefox SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/corporate/root python scripts/test_corporate.py
          BROWSERS=webkit,chromium,firefox SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/corporate/preview python scripts/test_corporate.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/posts/root python scripts/test_posts.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/posts/preview python scripts/test_posts.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/semantic/root python scripts/test_semantic.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/semantic/preview python scripts/test_semantic.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/browser python scripts/test_catalog.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/preview-browser python scripts/test_catalog.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/layout-fixes/after python scripts/test_layouts.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/layout-fixes/preview python scripts/test_layouts.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/polish/after python scripts/test_presentation.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/polish/preview python scripts/test_presentation.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/refinement/after python scripts/test_refinement.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/refinement/preview python scripts/test_refinement.py
          SITE_URL=http://127.0.0.1:4200/ REPORT_ROOT=reports/consistency/root python scripts/test_consistency.py
          SITE_URL=http://127.0.0.1:4201/preview/ REPORT_ROOT=reports/consistency/preview python scripts/test_consistency.py
      - name: Save review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-review
          path: reports/
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, validate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
