name: Build and deploy Jekyll to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Validate content
        run: bundle exec ruby scripts/check_content.rb
      - name: Build Jekyll
        run: JEKYLL_ENV=production bundle exec jekyll build --destination _site
      - name: Validate every rendered collection reference
        run: python3 scripts/check_collection_links.py
      - name: Check responsive images and accessible viewer
        run: |
          npm install --prefix "$RUNNER_TEMP/image-tests" --no-save playwright@1.56.1 axe-core
          "$RUNNER_TEMP/image-tests/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          python3 -m http.server 4000 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/image-server.log" 2>&1 &
          image_server_pid=$!
          trap 'kill "$image_server_pid"' EXIT
          export NODE_PATH="$RUNNER_TEMP/image-tests/node_modules"
          export AXE_PATH="$RUNNER_TEMP/image-tests/node_modules/axe-core/axe.min.js"
          node scripts/test_images.cjs
      - name: Save image test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-tests
          path: reports/image-tests/
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
