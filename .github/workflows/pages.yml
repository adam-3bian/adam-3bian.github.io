name: Build and deploy Jekyll to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Validate content
        run: bundle exec ruby scripts/check_content.rb
      - name: Verify build-time activity and empty-event fallback
        run: bundle exec ruby scripts/test_activity.rb
      - name: Verify original organisation artwork in SVG masks
        run: python3 scripts/prepare_organisation_logos.py --check
      - name: Verify safe Jekyll and non-empty base URL
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --safe --baseurl /preview --destination "$RUNNER_TEMP/baseurl-site/preview"
          python3 scripts/check_collection_links.py "$RUNNER_TEMP/baseurl-site/preview" --baseurl /preview
          python3 scripts/check_page_content.py "$RUNNER_TEMP/baseurl-site/preview" /preview
          python3 scripts/check_discovery.py "$RUNNER_TEMP/baseurl-site/preview" /preview
      - name: Build Jekyll
        run: JEKYLL_ENV=production bundle exec jekyll build --destination _site
      - name: Validate every rendered collection reference
        run: python3 scripts/check_collection_links.py
      - name: Validate every page, canonical route and metadata panel
        run: python3 scripts/check_page_content.py
      - name: Verify static discovery and social metadata
        run: python3 scripts/check_discovery.py
      - name: Check navigation, responsive images and accessible viewer
        run: |
          npm install --prefix "$RUNNER_TEMP/image-tests" --no-save playwright@1.56.1 axe-core
          "$RUNNER_TEMP/image-tests/node_modules/.bin/playwright" install --with-deps chromium --only-shell
          python3 -m http.server 4000 --bind 127.0.0.1 --directory _site > "$RUNNER_TEMP/image-server.log" 2>&1 &
          image_server_pid=$!
          python3 -m http.server 4001 --bind 127.0.0.1 --directory "$RUNNER_TEMP/baseurl-site" > "$RUNNER_TEMP/baseurl-server.log" 2>&1 &
          baseurl_server_pid=$!
          trap 'kill "$image_server_pid" "$baseurl_server_pid"' EXIT
          export NODE_PATH="$RUNNER_TEMP/image-tests/node_modules"
          export AXE_PATH="$RUNNER_TEMP/image-tests/node_modules/axe-core/axe.min.js"
          node scripts/test_navigation.cjs
          node scripts/test_images.cjs
          node scripts/test_content.cjs
          node scripts/test_homepage.cjs
          node scripts/test_search.cjs
          node scripts/test_directories.cjs
          node scripts/test_reading.cjs
          export SITE_DIR="$RUNNER_TEMP/baseurl-site/preview"
          export SITE_URL="http://127.0.0.1:4001/preview/"
          export REPORT_ROOT="reports/baseurl-tests"
          node scripts/test_navigation.cjs
          node scripts/test_images.cjs
          node scripts/test_content.cjs
          node scripts/test_homepage.cjs
          node scripts/test_search.cjs
          node scripts/test_directories.cjs
          node scripts/test_reading.cjs
      - name: Save base URL test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseurl-tests
          path: reports/baseurl-tests/
          if-no-files-found: ignore
      - name: Save content test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-tests
          path: reports/content-tests/
          if-no-files-found: ignore
      - name: Save navigation test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-tests
          path: reports/navigation-tests/
          if-no-files-found: ignore
      - name: Save image test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-tests
          path: reports/image-tests/
          if-no-files-found: ignore
      # Audit outputs remain available even though public navigation omits them.
      - name: Save maintainer validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-audit
          path: |
            reports/*.json
            _site/checks/index.html
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
