name: Build and deploy CHERI Alliance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-migration.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-migration.txt
      - name: Check Markdown and build the complete website
        run: |
          bundle exec ruby scripts/check_markdown.rb
          bundle exec ruby scripts/build.rb
      - name: Validate source content, local links and relationships
        run: |
          python scripts/check_build.py
          python scripts/check_site_links.py
          python scripts/check_entities.py
          python scripts/check_website.py
          bundle exec python -m unittest discover -s tests -v
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy the preview
        id: deployment
        uses: actions/deploy-pages@v4
