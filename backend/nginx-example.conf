# Install on the separate backend host, not on GitHub Pages.
# Replace the hostname, paths, certificate files and PHP-FPM socket for your host.
server {
    listen 443 ssl;
    server_name forms.example.org;

    ssl_certificate /etc/letsencrypt/live/forms.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.example.org/privkey.pem;
    root /srv/small-heath-forms/backend/public;
    client_max_body_size 128k;

    # Public endpoint: https://forms.example.org/forms/
    # Only this exact route executes PHP. private/ and vendor/ are outside web root.
    location = /forms/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/small-heath-forms/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /forms/;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 35s;
    }

    location / { return 404; }
}

server {
    listen 80;
    server_name forms.example.org;
    return 301 https://$host$request_uri;
}
