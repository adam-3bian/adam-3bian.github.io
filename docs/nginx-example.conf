# Portable _site deployment. Replace the host, paths, TLS files and PHP-FPM socket.
# Copy _site/* into /srv/small-heath/public/.
# Keep .env and writable form-runtime/ in /srv/small-heath/, outside public/.
server {
    listen 443 ssl;
    server_name housing.example.org;

    ssl_certificate /etc/letsencrypt/live/housing.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/housing.example.org/privkey.pem;
    root /srv/small-heath/public;
    index index.html;
    client_max_body_size 128k;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Only the exact form entry point runs PHP. Query strings are preserved.
    location = /forms/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/forms/index.php;
        fastcgi_param SCRIPT_NAME /forms/index.php;
        fastcgi_param FORM_ENV_FILE /srv/small-heath/.env;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_read_timeout 35s;
    }

    # The schema, support code and dependencies are read by PHP, not over HTTP.
    location ^~ /forms/ { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { return 404; }
}

server {
    listen 80;
    server_name housing.example.org;
    return 301 https://$host$request_uri;
}
