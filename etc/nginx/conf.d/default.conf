server {
    listen 80;
    server_name _;
    root /www/html;
    index index.html;
    client_max_body_size 128k;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /forms/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/html/forms/index.php;
        fastcgi_param FORM_ENV_FILE /run/small-heath/.env;
        fastcgi_param FORM_RUNTIME_DIR /var/lib/small-heath/form-runtime;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
        fastcgi_read_timeout 35s;
    }

    location ^~ /forms/ { return 404; }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\. { return 404; }
}
