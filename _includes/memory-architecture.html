<figure class="memory-architecture" data-memory-model data-state="bounds" aria-labelledby="memory-title">
  <div class="memory-drawing">
    <p class="diagram-label"><span>CHERI / Living Memory Architecture</span><span aria-hidden="true">01—05</span></p>
    <svg class="memory-svg" viewBox="0 0 900 610" role="img" aria-labelledby="memory-svg-title memory-svg-desc">
      <title id="memory-svg-title">A landscape of memory, with hardware-enforced authority</title>
      <desc id="memory-svg-desc">An isometric grid of memory cells. A translucent blue boundary marks the range authorised by one capability. A blue path shows a permitted read; a red path ends outside the boundary. A second compartment has separate authority. This is a conceptual illustration, not a physical memory layout.</desc>
      <defs>
        <pattern id="memory-grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#d6e2e8" stroke-width="1"/></pattern>
        <linearGradient id="memory-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d3f3f8" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity=".3"/></linearGradient>
        <linearGradient id="memory-side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c4dce5"/><stop offset="1" stop-color="#eff5f8"/></linearGradient>
        <filter id="memory-shadow" x="-30%" y="-50%" width="160%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
        <marker id="memory-arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3 0 6" fill="none" stroke="#125770" stroke-width="1.4"/></marker>
      </defs>
      <ellipse cx="450" cy="407" rx="302" ry="72" fill="#c6d9e2" opacity=".27" filter="url(#memory-shadow)"/>
      <g transform="matrix(.866 .5 -.866 .5 450 92)"><rect x="-105" y="-105" width="610" height="610" fill="url(#memory-grid)"/><rect x="-5" y="-5" width="410" height="410" fill="#f3f7f9" stroke="#b8cfd9"/></g>
      <path d="M95 292L450 497 805 292V309L450 514 95 309Z" fill="#e5eff3" stroke="#c6d9e2"/>
      <g class="memory-cells" stroke="#b6cdd8" stroke-width=".8" stroke-linejoin="round">
        {% for row in (0..7) %}{% for column in (0..7) %}{% assign cell_x = column | minus: row | times: 44 | plus: 450 %}{% assign cell_y = column | plus: row | times: 25 | plus: 100 %}{% assign cell_depth = 13 %}{% if row >= 2 and row <= 4 and column >= 2 and column <= 5 %}{% assign cell_y = cell_y | minus: 12 %}{% assign cell_depth = 25 %}{% endif %}{% assign side_y = cell_depth | plus: 23 %}{% assign bottom_y = cell_depth | plus: 46 %}
        <g transform="translate({{ cell_x }},{{ cell_y }})"{% if row >= 2 and row <= 4 and column >= 2 and column <= 5 %} class="memory-cell authorised-cell"{% elsif row >= 5 and column <= 2 %} class="memory-cell compartment-cell"{% else %} class="memory-cell"{% endif %}>
          <path class="cell-side" d="M-39 23L0 46 39 23V{{ side_y }}L0 {{ bottom_y }}-39 {{ side_y }}Z" fill="url(#memory-side)"/>
          <path class="cell-top" d="M0 0L39 23 0 46-39 23Z" fill="#fff"/>
          <path d="M0 46V{{ bottom_y }}" fill="none"/>
        </g>{% endfor %}{% endfor %}
      </g>
      <g class="memory-boundary">
        <path d="M450 164L626 264 494 339 318 239Z" fill="url(#memory-glass)" stroke="#3a91a9" stroke-width="1.5"/>
        <path d="M450 164V200M626 264V300M494 339V375M318 239V275" fill="none" stroke="#3a91a9" stroke-dasharray="3 4"/>
        <path d="M450 200L626 300 494 375 318 275Z" fill="none" stroke="#125770" stroke-width="1.5"/>
        <path d="M450 149L641 258M307 231L441 154" fill="none" stroke="#7cbdce" stroke-width=".7"/>
      </g>
      <g class="memory-compartment" fill="#dcecf3" fill-opacity=".65" stroke="#125770" stroke-width="1.5"><path d="M230 197L362 272 230 347 98 272Z"/><path d="M230 197V225M362 272V300M230 347V375M98 272V300" fill="none" stroke-dasharray="3 4"/></g>
      <g class="memory-access" fill="none" stroke="#125770" stroke-width="2.5"><path d="M723 156H654L538 224" marker-end="url(#memory-arrow)"/><circle cx="538" cy="224" r="9" fill="#fff"/><path d="M533 224L537 228 544 220"/></g>
      <g class="memory-rejection" fill="none" stroke="#ba1e1e" stroke-width="2.5"><path d="M729 370H663L626 349" stroke-dasharray="5 5"/><path d="M616 339L636 359M636 339L616 359"/><circle cx="626" cy="349" r="18" stroke-width="1"/></g>
      <g class="memory-write-rejection" fill="none" stroke="#ba1e1e" stroke-width="2.5"><path d="M723 156H654L538 224" stroke-dasharray="5 5"/><path d="M528 214L548 234M548 214L528 234"/><circle cx="538" cy="224" r="18" stroke-width="1"/></g>
      <g fill="#536874" font-family="ui-monospace, monospace" font-size="13">
        <path d="M196 154H263L353 205" fill="none" stroke="#738b98"/>
        <text x="87" y="123" fill="#125770" font-size="16" data-memory-capability>CAPABILITY C0</text><text x="87" y="146">tag: valid</text><text x="87" y="169" data-memory-permission>load + store</text>
        <text x="620" y="139" fill="#125770" data-memory-access-label>AUTHORISED ACCESS</text>
        <text class="memory-rejection" x="660" y="398" fill="#ba1e1e">ACCESS FAULT</text>
        <path d="M527 374V466H687" fill="none" stroke="#738b98"/><text x="556" y="490">HARDWARE-ENFORCED BOUNDS</text>
        <path class="memory-compartment" d="M230 375V465H112" fill="none" stroke="#738b98"/><text class="memory-compartment" x="112" y="493" fill="#125770" stroke="none">COMPARTMENT B</text>
        <text x="92" y="556">ADDRESS + AUTHORITY</text><text x="674" y="556">CHERI</text>
      </g>
    </svg>
  </div>
  <figcaption>
    <div class="memory-caption-head"><h2 id="memory-title">Memory. With boundaries.</h2><p class="technical-label" data-memory-result>{{ site.data.memory.steps.first.result | escape }}</p></div>
    <div class="memory-controls" role="group" aria-label="Explore the memory model">{% for step in site.data.memory.steps %}<button type="button" data-memory-state="{{ step.id }}" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="memory-explanation" disabled>{{ step.label | escape }}</button>{% endfor %}</div>
    <noscript><p>The illustration is static without JavaScript. Read every example in “About this illustration” below.</p></noscript>
    <div id="memory-explanation" class="memory-explanation" aria-live="polite" aria-atomic="true"><h3>{{ site.data.memory.steps.first.title | escape }}</h3><p>{{ site.data.memory.steps.first.description | escape }} <a href="{{ site.data.memory.steps.first.url | relative_url }}">Explore the technology</a></p></div>
    <details class="memory-notes"><summary>About this illustration</summary><p>This conceptual model makes capability authority visible. Capabilities are hardware-protected references, not physical boxes around memory. CHERI does not eliminate every vulnerability; temporal safety and secure compartment transitions also depend on the system design.</p><dl>{% for step in site.data.memory.steps %}<dt>{{ step.label | escape }}</dt><dd data-memory-copy="{{ step.id }}" data-result="{{ step.result | escape }}" data-title="{{ step.title | escape }}">{{ step.description | escape }} <a href="{{ step.url | relative_url }}">Read more</a></dd>{% endfor %}</dl><p>A valid tag distinguishes authentic capabilities. Provenance constrains derivation from existing authority. Sealing prevents ordinary dereferencing through a sealed capability; it is not encryption. <a href="{{ '/build/technology/tags-and-validity/' | relative_url }}">Tags and validity</a> · <a href="{{ '/build/technology/provenance/' | relative_url }}">Provenance</a> · <a href="{{ '/build/technology/sealing/' | relative_url }}">Sealing</a></p></details>
  </figcaption>
</figure>
