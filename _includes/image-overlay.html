<dialog class="image-dialog" id="image-dialog" aria-labelledby="image-dialog-title">
  <div class="image-dialog-header">
    <h2 id="image-dialog-title">Image preview</h2>
    <button class="button" type="button" data-image-close autofocus>Close <span aria-hidden="true">&times;</span></button>
  </div>
  <figure>
    <div class="image-dialog-media"></div>
    <figcaption id="image-dialog-caption"></figcaption>
  </figure>
</dialog>
