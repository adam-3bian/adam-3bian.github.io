<style>
/* CHERI Alliance theme. viewer.css retains the image viewer, enhancement
   fallbacks and content contracts; this is the shared visual system. */
:root {
  --ink: #071c2b;
  --muted: #536874;
  --teal: #125770;
  --teal-hover: #0a4055;
  --accent: #ba1e1e;
  --cyan: #54dae3;
  --paper: #fff;
  --white: #fff;
  --soft: #e9f3f5;
  --line: #d3e1e6;
  --control-line: #738b98;
  --focus: #b76900;
  --page-width: 80rem;
  --editorial-width: 80rem;
  --technical-width: 90rem;
  --reading-width: 46rem;
  --summary-width: 68ch;
  --gutter: clamp(1rem, 4vw, 4.5rem);
  --section-gap: clamp(2.75rem, 5vw, 5rem);
  --title-size: clamp(2rem, 1.25rem + 2.2vw, 3.75rem);
  --hero-size: clamp(2.85rem, 1.6rem + 4vw, 5.65rem);
  --radius: .125rem;
  font: 100%/1.75 "Poppins", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--paper);
}

/* Elements first: quiet surfaces, clear reading rhythm and native controls. */
body { background: var(--paper); overflow-wrap: anywhere; }
a { color: var(--teal); text-decoration-thickness: .065em; text-underline-offset: .22em; }
a:hover { color: var(--teal-hover); }
h1, h2, h3, h4, h5, h6 { color: var(--ink); font-weight: 600; }
h1 { line-height: 1.12; letter-spacing: -.045em; }
h2 { line-height: 1.25; letter-spacing: -.025em; }
h3 { line-height: 1.4; letter-spacing: -.015em; }
p { margin-bottom: 1.25rem; }
button, input, select, textarea { border-color: var(--control-line); border-radius: var(--radius); }
button, input, select { min-height: 44px; }
input, select, textarea { background: var(--white); }
button:hover { background: var(--soft); }
pre { padding: 1.25rem; color: var(--ink); background: #f3f7f9; border: 1px solid var(--line); border-radius: var(--radius); }
code { font-family: var(--mono); }
blockquote { border-left-color: var(--teal); color: var(--muted); }
figcaption { line-height: 1.65; }
hr { border-color: var(--line); }

/* One common frame. Technical pages deliberately allow media to extend to
   90rem; their paragraphs and headings retain the 46rem reading measure. */
.container { max-width: var(--page-width); }
.main-container { padding-block: 1.5rem 4rem; }
.main-container.width-technical { width: calc(100% - var(--gutter) - var(--gutter)); max-width: var(--technical-width); }
.main-container > .breadcrumb,
.main-container > article > .record-header,
.main-container > article > .metadata,
.main-container > article > .relationships,
.main-container > article > .listing,
.main-container > article > .onward {
  width: 100%;
  max-width: var(--page-width);
  margin-inline: auto;
}
.width-reading { max-width: var(--reading-width); }
.width-editorial { max-width: var(--editorial-width); }
.width-full { max-width: var(--page-width); }
.width-technical { max-width: var(--technical-width); }
.eyebrow, .technical-label, .diagram-label { color: var(--muted); }
.eyebrow { font-size: .6875rem; line-height: 1.6; letter-spacing: .12em; }
.summary, .lede { font-size: var(--text-summary); line-height: 1.75; color: var(--muted); }
.text-action { max-width: 100%; min-width: 0; gap: .75rem; text-decoration-thickness: .065em; }
.action-links ul { gap: .75rem 1.25rem; }
.action-links li { min-width: 0; max-width: 100%; }
.action-links a { max-width: 100%; min-width: 0; gap: 1.5rem; padding: .75rem 1.1rem; border-radius: var(--radius); }
.action-links a:not(.primary-action) { border-bottom-color: var(--control-line); }
:is(.primary-action, .record-actions .primary-resource a, .onward a) {
  min-height: 46px;
  background: var(--teal);
  border-radius: var(--radius);
  color: var(--white);
}
:is(.primary-action, .record-actions .primary-resource a, .onward a):is(:hover, :focus-visible) { background: var(--teal-hover); color: var(--white); }
.link-arrow { width: 1rem; height: 1rem; }

/* Preserve the native, grouped mega-menu. Changes here are proportional:
   alignment, readable density and viewport containment, never hierarchy. */
.site-header { padding-block: 1rem; border-bottom-color: var(--line); background: var(--white); }
.header-row { gap: 1rem; }
.brand img { width: 10.25rem; }
.search-link { padding-inline: .5rem; font-size: .8125rem; color: var(--muted); }
.source-nav { font-size: .875rem; }
.source-nav summary { font-size: .875rem; font-weight: 500; padding-block: .65rem; }
.source-nav :is(a, summary):is(:hover, :focus-visible),
.primary-menu[open] > summary { background: #f0f6f8; }
.primary-menu > .current-section { color: var(--teal); text-underline-offset: .45em; }
.primary-menu-panel { border-color: var(--line); background: var(--white); }
.primary-menu:not([open]) > .primary-menu-panel { display: none; }
.primary-menu-panel > .section-link { font-size: 1rem; padding-bottom: .9rem; margin-bottom: .75rem; }
.primary-menu-panel a { line-height: 1.45; }
.menu-group-label { color: var(--muted); font-size: .6875rem; line-height: 1.6; letter-spacing: .11em; }
.menu-links .has-children > a, .nested-menu-label { color: var(--ink); font-weight: 600; }
.menu-links .menu-links { border-left-color: var(--line); }
.menu-links .menu-links a { font-size: .875rem; }
.menu-status { border-color: var(--line); color: var(--muted); }
.navigation-toggle { min-height: 44px; border-color: var(--control-line); background: var(--white); }
.navigation-toggle:hover { background: var(--soft); }

/* The homepage has a white scientific stage and one dark closing scene.
   Hexagons are a decorative identity layer, distinct from the memory model. */
.home-hero {
  position: relative;
  isolation: isolate;
  grid-template-columns: 1fr 1.12fr;
  gap: 1rem 2rem;
  padding-block: clamp(1.5rem, 2.75vw, 2.75rem) 2rem;
}
.home-hero::before {
  content: "";
  position: absolute;
  z-index: -1;
  pointer-events: none;
  inset: 0 0 auto auto;
  width: 41%;
  height: 21rem;
  background: url("{{ '/assets/common/hexagons-light.webp' | relative_url }}") right 30% / 26rem auto no-repeat;
  opacity: .055;
}
.hero-copy { padding-top: .5rem; }
.home-hero h1 { font-size: var(--hero-size); line-height: 1.06; letter-spacing: -.065em; font-weight: 500; margin: 1.1rem 0 1.75rem; }
.home-hero h1 span { color: var(--teal); }
.hero-statement { max-width: 46ch; font-size: clamp(1rem, .9rem + .35vw, 1.1875rem); line-height: 1.7; }
.hero-definition { max-width: 58ch; margin-top: 1.5rem; font-size: .8125rem; line-height: 1.8; }
.memory-architecture { width: 100%; margin: 0; }
.diagram-label { padding-block: .75rem; font-size: .625rem; letter-spacing: .045em; border-top-color: var(--line); }
.memory-svg { filter: contrast(1.04); }
.memory-svg .memory-cells { stroke: #a3c0cc; }
.memory-svg .cell-top { fill: #fcfeff; }
.memory-svg .authorised-cell .cell-top { fill: #d8edf3; stroke: #79aebe; }
.memory-svg text { font-size: 14px; }
.memory-caption-head h2 { color: var(--ink); font-size: 1.125rem; font-weight: 500; letter-spacing: -.02em; }
.memory-controls { gap: .35rem; }
.memory-controls button { border-color: var(--control-line); font-size: .6875rem; padding: .5rem .6rem; overflow-wrap: anywhere; }
.memory-controls button:hover { background: var(--soft); }
.memory-controls button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--white); }
.memory-explanation { min-height: 6rem; }
.memory-explanation h3 { font-size: .8125rem; }
.memory-explanation p, .memory-notes { font-size: .75rem; line-height: 1.8; }
.memory-notes summary { color: var(--teal); }
.home-scene { grid-template-columns: 1fr 1fr; gap: 2rem 4rem; padding-block: var(--section-gap); }
.home-explanation { padding-top: 2.5rem; }
.scene-heading h2, .home-pathways > h2 {
  max-width: 22ch;
  font-size: clamp(1.875rem, 1.1rem + 1.85vw, 3.15rem);
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -.045em;
}
.scene-introduction { padding-top: 1.75rem; }
.scene-introduction > p { max-width: 62ch; }
.home-topics { margin-top: 1rem; gap: 2rem 3rem; }
.home-topics li { border-color: var(--line); padding-top: 1.15rem; }
.home-topics h3 { font-size: 1.0625rem; }
.home-topics p, .home-journeys p { font-size: .875rem; line-height: 1.8; }
.home-practice { background: #f1f6f8; box-shadow: 0 0 0 100vmax #f1f6f8; }
.home-practice .cards { gap: 2rem; }
.home-practice .card { background: transparent; }
.home-practice .card img { padding: .875rem; background: var(--white); }
.home-practice .card-text { padding-top: 1.15rem; }
.home-practice .card-text h3 { font-size: 1.125rem; }
.home-ecosystem .resource-paths { column-gap: 2rem; }
.home-pathways { padding-block: var(--section-gap); }
.home-journeys { gap: 2rem 3rem; }
.home-journeys > li:nth-child(-n+3) { padding-bottom: .75rem; }
.home-journeys > li:nth-child(-n+3) h3 { font-size: clamp(1.875rem, 1.05rem + 1.75vw, 2.875rem); letter-spacing: -.045em; }
.home-journeys a { min-width: 0; overflow-wrap: anywhere; color: var(--teal); }
.home-alliance { border-top-color: var(--line); }
.member-strip { gap: 1.75rem; margin-block: 1.5rem 2rem; }
.activity-columns { gap: 2rem 4rem; }
.activity-columns h3 { font-size: .6875rem; letter-spacing: .1em; }
.activity-list li { border-color: var(--line); }
.activity-list h4 { font-size: 1.0625rem; line-height: 1.55; }
.home-future {
  position: relative;
  isolation: isolate;
  color: var(--white);
  background: var(--ink);
  box-shadow: 0 0 0 100vmax var(--ink);
  clip-path: inset(0 -100vmax);
  border: 0;
  padding-block: clamp(3rem, 5.5vw, 5.5rem);
  margin-block: 1rem 3.5rem;
}
.home-future::before {
  content: "";
  position: absolute;
  z-index: -1;
  pointer-events: none;
  inset: 0 0 0 auto;
  width: 45%;
  background: url("{{ '/assets/common/hexagons.svg' | relative_url }}") right center / 28rem auto no-repeat;
  filter: invert(1);
  opacity: .08;
}
.home-future h2 { color: var(--white); max-width: 25ch; font-size: clamp(2rem, 1.05rem + 3.2vw, 4.5rem); line-height: 1.16; letter-spacing: -.05em; }
.home-future .eyebrow { color: #adcad5; }
.home-future .action-links a.primary-action { background: var(--white); color: var(--teal); }
.home-future .action-links a.primary-action:hover { background: var(--soft); color: var(--teal-hover); }
.home-future .action-links a:not(.primary-action) { color: var(--white); border-bottom-color: #9db7c4; }
.home-page > .index-navigation { padding-block: .5rem 1.25rem; }
.home-page > .index-navigation h2 { font-size: 1.125rem; }

/* Section pages reproduce their menu hierarchy inside an editorial frame. */
.index-intro {
  position: relative;
  isolation: isolate;
  grid-template-columns: 1.1fr 1fr;
  gap: 2rem 4rem;
  padding-block: 1.75rem 2.5rem;
  margin-block: .5rem 2rem;
  border-color: var(--line);
}
.index-intro::before {
  content: "";
  position: absolute;
  z-index: -1;
  pointer-events: none;
  inset: -1rem 0 auto auto;
  width: 21rem;
  max-width: 45%;
  height: 12rem;
  background: url("{{ '/assets/common/hexagons.svg' | relative_url }}") right center / 19rem auto no-repeat;
  opacity: .025;
}
.index-intro h1 { max-width: 21ch; }
.index-intro p { font-size: 1rem; line-height: 1.8; }
.landing-page > :is(section, .index-navigation) { margin-block: 3rem; }
.landing-page h2 { margin-top: 0; font-size: 1.5rem; }
.landing-page > .recent-activity { padding-bottom: 0; }
.resource-paths { gap: 1.5rem 2.5rem; }
.resource-paths li { border-color: var(--line); padding-top: 1rem; }
.resource-paths h3 { font-size: 1.0625rem; line-height: 1.5; }
.resource-paths p, .group-description { font-size: .875rem; line-height: 1.8; }
.index-group-label { border-color: var(--line); color: var(--ink); }
.index-navigation a { padding-block: .65rem; line-height: 1.5; }
.index-navigation a:is(:hover, :focus-visible), .link-grid a:is(:hover, :focus-visible) { background: #f0f6f8; }
.index-pages > li > ul > li + li { border-color: var(--line); }

/* Calm editorial pages: full-width introductions, bounded facts and art,
   followed by readable prose and deliberately wider technical material. */
.breadcrumb { font-size: .75rem; line-height: 1.6; margin-bottom: 1.25rem; }
.record-header { padding-bottom: 2rem; }
.record-intro { min-width: 0; }
.record-header h1 { font-size: var(--title-size); }
.ordinary-page .record-header { border-color: var(--line); margin-bottom: 2rem; padding-bottom: 2rem; }
article[data-collection="pages"] .record-intro { grid-template-columns: 1.1fr 1fr; gap: 1rem 4rem; }
article[data-collection="pages"] .record-intro:has(.detail-introduction) { display: grid; }
article[data-collection="pages"] .record-intro > .detail-introduction { grid-column: 2; }
.ordinary-page .summary { line-height: 1.8; font-size: 1rem; }
.collection-detail .record-header { border-color: var(--line); padding-bottom: 2rem; margin-bottom: 2rem; }
.collection-detail .record-intro h1 { max-width: 36ch; font-size: clamp(2rem, 1.4rem + 1.8vw, 3.375rem); }
.collection-detail .record-header:not(.has-image) .record-intro:has(.summary, .detail-introduction) { grid-template-columns: 1.1fr 1fr; gap: .75rem 4rem; }
.collection-detail :is(.summary, .detail-introduction) { font-size: 1rem; line-height: 1.8; }
.collection-detail .record-header .lead-image { border-radius: var(--radius); background: var(--image-background, transparent); }
.record-actions { margin-top: .4rem; }
.record-actions a { font-size: .875rem; }
.collection-detail .metadata { display: grid; grid-template-columns: minmax(11rem, 1fr) minmax(0, 2fr); gap: 1rem 3rem; margin-bottom: 2.25rem; font-size: .9375rem; }
.collection-detail .metadata h2 { margin-top: 0; font-size: .9375rem; }
.collection-detail .metadata dl { grid-template-columns: minmax(7rem, 10rem) minmax(0, 1fr); gap: .6rem 1.5rem; }
.metadata :is(dt, dd) { line-height: 1.7; }
.metadata dt { color: var(--muted); }
.resource-links a { border-color: var(--line); border-radius: var(--radius); }
.article-content > :is(p, ul, ol, dl, blockquote):not(.image-gallery, .cards, .link-grid):not(:has(img)),
.article-content > :is(h2, h3, h4, h5, h6) { max-width: var(--reading-width); }
.article-content > h2 { margin-top: 2.75rem; margin-bottom: 1rem; font-size: clamp(1.35rem, 1.15rem + .5vw, 1.7rem); }
.article-content > h3 { margin-top: 2rem; font-size: 1.125rem; }
.article-content > p { margin-bottom: 1.25rem; }
.article-content img { border-radius: var(--radius); background: var(--image-background, transparent); }
.article-content figcaption { color: var(--muted); font-size: .8125rem; }
.article-content > pre { max-width: var(--page-width); }
.article-content .table-scroll { border-color: var(--line); border-radius: var(--radius); }
.article-content :is(th, td) { border-color: var(--line); padding: .65rem .8rem; }
.article-content th { background: #f0f6f8; font-weight: 600; }
.table-of-contents { border-color: var(--line); margin-block: 1.75rem; }
.table-of-contents > summary { font-size: .9375rem; }
.table-of-contents a { font-size: .875rem; }
.relationships { border-color: var(--line); gap: 1.5rem 3rem; padding-top: 2rem; margin-top: 3rem; }
.relationships > h2 { font-size: 1.5rem; }
.relationship-group:only-of-type { grid-column: 1 / -1; }
.relationship-group:only-of-type .link-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.relationship-group h3 { font-size: 1.0625rem; }
.link-grid a { padding-block: .65rem; font-size: .9375rem; }
.notice { background: #eef5f7; border-radius: var(--radius); }

/* Collection patterns remain content-specific: image-led cards, compact
   directories, bibliographies and open rows share typography and boundaries. */
.cards { gap: 1.5rem; }
.card { background: var(--white); border-color: var(--line); border-radius: var(--radius); transition: background-color 160ms ease, border-color 160ms ease; }
.card:is(:hover, :focus-visible) { border-color: var(--teal); background: #f3f8fa; }
.card img { background: var(--image-background, #f1f6f8); }
.card-text { padding: 1.25rem; }
.card-text :is(h3, h4) { color: var(--teal); font-size: 1.0625rem; font-weight: 600; line-height: 1.45; }
.card-text p { font-size: .8125rem; line-height: 1.75; }
.card-text :is(.card-description, .paper-description) { font-size: .875rem; line-height: 1.8; }
.card-text .card-action { font-size: .75rem; }
:is(.directory-list, .resource-list, .bibliography-list, .document-list) .card { border-color: var(--line); border-radius: 0; padding-block: 1.35rem; }
:is(.directory-list, .resource-list, .bibliography-list, .document-list) .card-text { padding: 0; }
.directory-list .card-text { grid-template-columns: minmax(12rem, 1fr) minmax(0, 2fr); gap: .375rem 2rem; }
.directory-list .card img { border-radius: var(--radius); }
.directory-list .card-description { font-size: .875rem; }
.bibliography-list .card-text { column-gap: 1.5rem; }
.bibliography-list .card-citation { font-size: .8125rem; }
.document-list .card-text { column-gap: 2rem; }
.listing { margin-top: 2rem; }
.section-heading h2 { font-size: 1.375rem; }
.section-heading p { font-size: .8125rem; }
.directory-controls fieldset, .search-controls fieldset { gap: 1rem; }
.directory-controls .control-field, .search-controls label { font-size: .8125rem; }
.directory-controls :is(input, select), .search-controls :is(input, select) { background: var(--white); border-color: var(--control-line); font-size: .9375rem; }
.alphabet-navigation a { font-size: .875rem; }
.search-results li { border-color: var(--line); padding-block: 1.25rem; }
.search-results h3 { font-size: 1.125rem; }
.search-results p { font-size: .9375rem; }

/* Every footer destination remains exposed in its original group. */
.site-footer { padding-block: 3rem 1.25rem; background: #eef5f7; border-top-color: var(--line); font-size: .8125rem; }
.site-footer .footer-brand { margin-bottom: 2.5rem; }
.site-footer .footer-brand img { width: 10.25rem; }
.footer-groups { gap: 1.5rem 2rem; }
.footer-group-label { font-size: .8125rem; color: var(--ink); margin-bottom: .75rem; }
.site-footer a { color: var(--teal); line-height: 1.55; }
.footer-bottom { border-top-color: var(--line); padding-top: 1.25rem; margin-top: 2.5rem; }
.footer-copyright { font-size: .75rem; }
.footer-utilities a { font-size: .75rem; }

/* Breakpoints change composition, never which source content is available. */
@media (min-width: 64rem) {
  .site-header > .container { gap: .75rem 1.5rem; }
  .primary-menu-list { gap: .25rem; }
  .primary-menu > summary { padding-inline: .65rem; }
  .primary-menu-panel { padding: 1.5rem; box-shadow: 0 1.5rem 3rem #071c2b14; }
  .menu-groups { gap: 1.25rem; }
  .menu-group + .menu-group { border-left-color: var(--line); }
  .memory-controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .memory-controls button { min-width: 0; }
}
@media (max-width: 63.999rem) {
  .primary-menu-panel { max-height: min(42rem, 65dvh); }
  .collection-detail .metadata { grid-template-columns: minmax(9rem, 1fr) minmax(0, 2.5fr); gap: 1rem 2rem; }
}
@media (max-width: 60rem) {
  :root { --gutter: 1.5rem; }
  .home-hero { grid-template-columns: minmax(0, 1fr); padding-bottom: 3rem; }
  .hero-copy { max-width: 48rem; }
  .hero-definition { max-width: 64ch; }
  .home-hero::before { width: 50%; height: 19rem; opacity: .035; }
  .memory-architecture { max-width: 54rem; margin-inline: auto; }
  .home-scene { gap: 2rem 2.5rem; }
  .home-topics { gap: 1.5rem; }
  .activity-columns { gap: 2rem 2.5rem; }
  .index-intro, article[data-collection="pages"] .record-intro { gap: 1.5rem 2rem; }
  .collection-detail .record-header:not(.has-image) .record-intro:has(.summary, .detail-introduction) { gap: 1rem 2rem; }
  .directory-list .card-text { display: flex; }
  .home-ecosystem .resource-paths { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 40rem) {
  :root { --gutter: 1rem; --section-gap: 2.75rem; }
  .site-header { padding-block: .75rem; }
  .header-row { gap: .5rem; }
  .header-row .brand img { width: 7.5rem; }
  .main-container { padding-block: 1.25rem 3rem; }
  .home-hero { padding-block: 1.25rem 2.5rem; gap: 2rem; }
  .home-hero::before { display: none; }
  .hero-copy { padding-top: 0; }
  .home-hero h1 { margin-block: 1rem 1.5rem; letter-spacing: -.055em; }
  .hero-statement { font-size: 1rem; }
  .hero-definition { font-size: .8125rem; }
  .action-links a { padding-inline: .9rem; gap: 1rem; }
  .memory-svg text { font-size: 20px; }
  .memory-svg [data-memory-capability] { font-size: 24px; }
  .memory-svg [data-memory-access-label] { font-size: 20px; transform: translate(-35px, -10px); }
  .memory-controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .memory-controls button { min-width: 0; }
  .memory-explanation { min-height: 8rem; }
  .home-scene { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
  .scene-heading h2, .home-pathways > h2 { max-width: 100%; }
  .scene-introduction { padding-top: 0; }
  .home-topics, .home-journeys, .activity-columns { grid-template-columns: minmax(0, 1fr); }
  .home-topics { margin-top: .5rem; }
  .home-practice .cards { gap: 2rem; }
  .home-ecosystem .resource-paths { grid-template-columns: minmax(0, 1fr); }
