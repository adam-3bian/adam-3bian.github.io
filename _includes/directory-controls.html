<div class="directory-controls" data-directory-controls hidden>
  <label for="directory-query">Search {{ page.title | downcase | escape }}
    <input id="directory-query" type="search" autocomplete="off" placeholder="Search by name or topic">
  </label>
  {% if page.listing == 'people' or page.listing == 'organisations' or page.listing == 'events' and page.filter == nil %}
  <label for="directory-filter">Show
    <select id="directory-filter">
      <option value="">All {{ page.title | downcase | escape }}</option>
      {% if page.listing == 'people' %}<option value="speaker">Speakers</option><option value="author">Paper authors</option>{% endif %}
      {% if page.listing == 'organisations' %}<option value="member">Alliance members</option>{% endif %}
      {% if page.listing == 'events' %}<option value="upcoming">Upcoming events</option><option value="past">Past events</option>{% endif %}
    </select>
  </label>
  {% endif %}
</div>
<p class="directory-count" role="status" aria-live="polite" data-directory-count>{{ page.collection_items.size }} {{ page.title | downcase | escape }}</p>
