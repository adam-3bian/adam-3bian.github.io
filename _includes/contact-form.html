<section aria-labelledby="enquiry-title">
  <h2 id="enquiry-title">Your enquiry</h2>
  <form class="preview-form" data-unconnected-form aria-describedby="contact-preview-note">
    <p id="contact-preview-note">Preview form — messages are not sent. <a href="https://cheri-alliance.org/contact/#contact_form">Use the published Alliance contact form</a> to send an enquiry.</p>
    <div class="form-grid">
      <label class="form-wide" for="enquiry-topic">Request
        <select id="enquiry-topic" name="topic">
          <option>I would like to know more about CHERI Alliance.</option>
          <option>I am interested in becoming a member.</option>
          <option>I would like to know more about or contact a working group.</option>
          <option>I have a press related matter.</option>
          <option>I would like to know more about the Ambassador Program.</option>
          <option>I would like to know more about or apply to the CHERI Enabled Program.</option>
          <option>I have a question about Trademark permissions.</option>
          <option>I am interested in a Morello board.</option>
          <option>I have another request.</option>
        </select>
      </label>
      <label for="enquiry-first-name">First name<input id="enquiry-first-name" name="first-name" autocomplete="given-name"></label>
      <label for="enquiry-last-name">Last name<input id="enquiry-last-name" name="last-name" autocomplete="family-name"></label>
      <label class="form-wide" for="enquiry-email">Email<input id="enquiry-email" name="email" type="email" autocomplete="email"></label>
      <label class="form-wide" for="enquiry-message">Your request<textarea id="enquiry-message" name="message"></textarea></label>
    </div>
    <button type="submit" disabled>Send enquiry</button>
    <p class="preview-note">Submission is unavailable in this preview. See the <a href="{{ '/policies/privacy/' | relative_url }}">privacy policy</a>.</p>
  </form>
</section>
