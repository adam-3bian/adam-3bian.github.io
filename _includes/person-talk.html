<article class="talk-card content-panel" data-talk-id="{{ include.item.id | remove_first: 'talk-' | escape }}"><div class="talk-copy"><p class="meta">{% include date.html value=include.date %}</p><h3>{{ include.item.title | escape }}</h3><p class="meta"><a href="{{ include.event.url | relative_url }}#{{ include.item.id | escape }}">{{ include.event.title | escape }}</a>{% if include.event.event.location.venue %} · {{ include.event.event.location.venue | escape }}{% endif %}</p></div><div class="talk-actions">{% include resource-links.html record=include.event scope=include.item.id %}</div></article>
