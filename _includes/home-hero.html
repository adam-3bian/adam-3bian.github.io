<section class="hero hero-large" aria-labelledby="page-title">
  <div class="hero-intro">
    <span id="page-hero-title" class="anchor-alias"></span><span id="hero-title" class="anchor-alias"></span>
    <h1 id="page-title" class="page-hero-title"><span class="hero-opening">{{ page.landing.heading.title | escape }}</span><small class="hero-support">{% for line in page.landing.heading.subtitle %}<span{% if forloop.last %} class="hero-signoff"{% endif %}>{{ line | escape }}</span>{% endfor %}</small></h1>
    <div class="lede">{{ page.summary | markdownify }}</div>
    {% if page.landing.heading.introduction %}<div class="lede">{{ page.landing.heading.introduction | markdownify }}</div>{% endif %}
  </div>
</section>
