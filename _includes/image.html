{% assign media = include.image %}
{% if media.src %}<img src="{% include url.html url=media.src %}" alt="{{ media.alt | default: '' | escape }}"{% if media.width %} width="{{ media.width }}"{% endif %}{% if media.height %} height="{{ media.height }}"{% endif %} class="{{ include.class }}{% if media.fit == 'contain' %} image-contain{% endif %}{% if media.position == 'left' %} image-crop-left{% elsif media.position == 'right' %} image-crop-right{% endif %}" loading="{% if include.eager %}eager{% else %}lazy{% endif %}" decoding="async">{% endif %}
