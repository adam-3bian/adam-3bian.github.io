<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    document.documentElement.classList.add('navigation-enhanced');
    {% if page.listing %}document.documentElement.classList.add('directory-enhanced');{% endif %}
    document.addEventListener('DOMContentLoaded', function () {
      if (!document.querySelector('#header-navigation[data-navigation-ready]')) document.documentElement.classList.remove('navigation-enhanced');
      if (!document.querySelector('.directory-controls[data-directory-ready]')) document.documentElement.classList.remove('directory-enhanced');
    });
  </script>
  {% include seo.html %}
  <meta name="theme-color" content="#125770">
  <link rel="icon" href="{{ '/assets/brand/favicon.ico' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/poppins-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/poppins-latin-600-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/viewer.css' | relative_url }}">
  <script src="{{ '/assets/navigation.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/viewer.js' | relative_url }}" defer></script>
  {% if page.listing %}<script src="{{ '/assets/directories.js' | relative_url }}" defer></script>{% endif %}
  {% if page.url == '/search/' %}<script src="{{ '/assets/search.js' | relative_url }}" defer></script>{% endif %}
  {% if page.url == '/' %}<script src="{{ '/assets/memory-architecture.js' | relative_url }}" defer></script>{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" tabindex="-1" class="container main-container">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
