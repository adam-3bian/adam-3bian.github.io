<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/viewer.css' | relative_url }}">
  <script src="{{ '/assets/navigation.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/viewer.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" class="container main-container">{{ content }}</main>
  <footer class="site-footer">
    <div class="container">
      <nav class="source-footer-nav" aria-label="Source footer navigation">{% include navigation.html items=site.navigation.footer %}</nav>
      <p>Minimal Jekyll viewer · {{ site.data.checks.record_count }} source records · Built {{ site.time | date: '%d %B %Y' }}</p>
      <a href="{{ '/checks/' | relative_url }}">View the content audit</a>
    </div>
  </footer>
</body>
</html>
