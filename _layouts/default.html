<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  {% assign canonical_route = site.data.viewer.aliases[page.url] | default: page.url %}
  <link rel="canonical" href="{{ canonical_route | absolute_url }}">
  {% if page.layout == 'redirect' %}<meta http-equiv="refresh" content="0; url={{ canonical_route | relative_url | escape }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/viewer.css' | relative_url }}">
  <script src="{{ '/assets/navigation.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/viewer.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" class="container main-container">{{ content }}</main>
  {% include footer.html %}
</body>
</html>
