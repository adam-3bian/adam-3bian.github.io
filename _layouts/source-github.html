<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }}</title>
<link rel="stylesheet" href="/assets/shared/source-github-local.css">
<style>
.image-left { float: left; }
.image-right { float: right; }
.image-full { display: block; max-width: 100%; height: auto; }
.image-inline.image-left, .image-inline.image-right { float: none; display: inline; max-width: 100%; }
.entity-sidebar .image-left { float: none; }

.entity-media p, .collection-detail__lead-image p { margin: 0; width: 100%; height: 100%; }
</style>
