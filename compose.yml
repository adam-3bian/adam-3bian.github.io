name: small-heath-park

services:
  site-build:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: site-builder
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:8080}
    volumes:
      - ${SITE_ROOT_DIR:-./www/html}:/www/html
      - ${SITE_CONFIG_DIR:-./etc/small-heath}:/etc/small-heath:ro
    restart: "no"

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: php-runtime
    environment:
      FORM_ENV_FILE: /run/small-heath/.env
      FORM_RUNTIME_DIR: /var/lib/small-heath/form-runtime
    volumes:
      - ${SITE_ROOT_DIR:-./www/html}:/www/html:ro
      - ${SITE_CONFIG_DIR:-./etc/small-heath}:/etc/small-heath:ro
      - ${SITE_RUNTIME_DIR:-./var/lib/small-heath/form-runtime}:/var/lib/small-heath/form-runtime
    tmpfs:
      - /run/small-heath
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      site-build:
        condition: service_completed_successfully
      php:
        condition: service_started
    ports:
      - "${SITE_PORT:-8080}:80"
    volumes:
      - ./etc/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${SITE_ROOT_DIR:-./www/html}:/www/html:ro
    restart: unless-stopped
